server {
    listen 80;

    root /usr/share/nginx/html/gamq-deportes;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Serve the Angular app (handles deep links)
    location /gamq-deportes/ {
        try_files $uri $uri/ /gamq-deportes/index.html;
    }

    # Proxy to main backend (181.177.143.187:8085)
    location /api/ {
        proxy_pass http://181.177.143.187:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to auth/login backend (181.177.143.185:8080)
    location /auth-api/ {
        proxy_pass http://181.177.143.185:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirect root to app
    location = / {
        return 301 /gamq-deportes/;
    }
}