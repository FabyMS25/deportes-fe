server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /gamq-deportes/ {
        try_files $uri $uri/ /gamq-deportes/index.html;
    }

    # Redirect root to subpath
    location = / {
        return 301 /gamq-deportes/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}