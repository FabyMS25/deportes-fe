types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    root /usr/share/nginx/html/gamq-deportes;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Frontend
    location /gamq-deportes/ {
        alias /usr/share/nginx/html/gamq-deportes/;
        try_files $uri $uri/ /gamq-deportes/index.html;    # ← remove the =404 at the end
    }

    # Backend API
    location /api/ {
        proxy_pass http://181.177.143.187:8085/api/;
        proxy_set_header Host 181.177.143.187:8085;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin http://181.177.143.187:8085;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # Auth API
    location /auth-api/ {
        proxy_pass http://181.177.143.185:8080/api/;
        proxy_set_header Host 181.177.143.185:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin http://181.177.143.185:8080;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # WebSocket
    location /ws-notificaciones/ {
        proxy_pass http://181.177.143.187:8085/ws-notificaciones/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        return 301 /gamq-deportes/;
    }

    location = /gamq-deportes/manifest.webmanifest {
        alias /usr/share/nginx/html/gamq-deportes/manifest.webmanifest;
    }
}