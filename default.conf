# This file is included inside nginx's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve HTTPS when the Windows host's Caddy/Apache is the outer proxy.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Only Angular's content-hashed bundles are immutable. Other files revalidate.
map $uri $asset_cache_control {
    default "no-cache";
    "~*\.[a-f0-9]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve again after a backend container is recreated with another IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $deportes_backend http://be-deportes:8085;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $asset_cache_control always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass $deportes_backend$request_uri;
    }

    location ~ ^/ws-notificaciones(?:/|$) {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass $deportes_backend$request_uri;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|json|webmanifest|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
