<!-- Start Breadcrumbs -->
<app-breadcrumbs [title]="title | translate" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
    <app-data-header
        [title]="title"
        [headersImport]="headersImport"
        [newShow]="canActivate.includes('CREAR')"
        [importShow]="canActivate.includes('CREAR')"
        [exportShow]="canActivate.includes('VER')"
        (createEmitter)="openModal( undefined,content,'')"
        (importEmitter)="openModalImport()"
        (exportEmitter)="csvFileExport()"
    ></app-data-header>
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <div class="row g-2">
                    <div class="col-12 col-lg-6">
                        <div class="search-box">
                            <input type="text" name="searchTerm" class="form-control" placeholder="Buscar por ..."
                                [(ngModel)]="searchTerm" (ngModelChange)="performSearch()">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
            <app-data-table
                [loading]="loading"
                [itemsList]="itemsList"
                [allcontent]="superficiesList"
                [actions]="{
                  show: canActivate.includes('VER'),
                  edit: canActivate.includes('ACTUALIZAR'),
                  delete: canActivate.includes('ELIMINAR'),}"
                    (showItemEmitter)="openModal($event,content,'show')"
                    (editItemEmitter)="openModal($event,content,'edit')"
                    (deleteItemEmitter)="deleteModal(deleteModel,$event)"
                [multiCheck]="canActivate.includes('CREAR')"
                (selectedItemEmitter)="getSelectedItems($event)" 
                [viewMode]="viewMode"   
            ></app-data-table>
            </div>
        </div>

    </div>
</div>
<!--end row-->

<!-- Modals -->
<ng-template #content role="document" let-modal>
    <div class="modal-header bg-light p-3">
        <h5 class="modal-title" class="tablelist-form" autocomplete="off" *ngIf="accion === ''" ngbAutofocus>Agregar Superficie</h5>
        <h5 class="modal-title" *ngIf="accion === 'edit'" ngbAutofocus>Editar Datos</h5>
        <h5 class="modal-title" *ngIf="accion === 'show'" ngbAutofocus>Superficie</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
            id="close-modal" (click)="closeModal()"></button>
    </div>
    <form (ngSubmit)="saveData()" [formGroup]="contentForm" class="tablelist-form" autocomplete="off">
        <div class="modal-body">
            <input type="hidden" name="uuid" formControlName="uuid" />
            <div class="row g-3">
                <div class="col-lg-12">
                    <div>
                        <label for="descripcion-field" class="form-label">Descripción</label>
                        <input type="text" id="descripcion-field" class="form-control"
                            placeholder="Ingresan el descripcion del Deporte" required formControlName="descripcion"
                            [ngClass]="{ 'is-invalid': submitted && form['descripcion'].errors }" />
                        @if(submitted && form['descripcion'].errors){
                        <div class="invalid-feedback" align="left">
                            @if(form['descripcion'].errors['required']){
                            <div>El campo es requirido</div>
                            }
                        </div>
                        }
                    </div>
                </div>
                <!--end col-->
            </div>
            <!--end row-->
        </div>
        <div class="modal-footer">
            <div class="hstack gap-2 justify-content-end">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal"
                    (click)="closeModal()">Cerrar</button>
                <button type="submit" class="btn btn-primary" id="add-btn">Guardar</button>
            </div>
        </div>
    </form>
</ng-template>

<ng-template #deleteModel let-modal>
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="btn-close"
                (click)="modal.dismiss('Cross click')"></button>
        </div>
        <div class="modal-body">
            <div class="mt-2 text-center">
                <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop"
                    colors="primary:#405189,secondary:#f06548" style="width:90px;height:90px"></lord-icon>
                <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
                    <h4>Estas seguro de Eliminar el Registro ?</h4>
                    <p class="text-muted mx-4 mb-0">
                        Al Confirmar la eliminacion se quitara toda informacion de nuestra base de datos.
                    </p>
                </div>
            </div>
            <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
                <button class="btn btn-link link-success fw-medium text-decoration-none" data-bs-dismiss="modal"
                    id="deleteRecord-close" (click)="modal.close('Close click')"><i
                        class="ri-close-line me-1 align-middle"></i> Cancelar</button>
                <button type="button" class="btn w-sm btn-danger " id="delete-product" (click)="deleteData()"
                    (click)="modal.close('Close click')">Si, Elmimar!</button>
            </div>
        </div>
    </div>
</ng-template>
