<!-- Start Breadcrumbs -->
<app-breadcrumbs [title]="title | translate" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-header border-0 d-flex flex-wrap align-items-center">
        <h5 class="card-title flex-grow-1">{{'Lista de '+title|translate }}</h5>
        <div class="flex-shrink-0">
          <div class="d-flex gap-1 flex-wrap">
            <button *ngIf="canActivate.includes('CREAR')" (click)="openModal(undefined,'','lg')"
              type="button" class="btn btn-soft-secondary">
              <i class="ri-add-circle-line align-middle"></i>
              {{"Agregar" | translate}}
            </button>
            <button *ngIf="canActivate.includes('VER')" (click)="csvFileExport()"
              class="btn btn-soft-info" id="remove-actions" style="display: none">
              <i class="ri-file-download-line align-bottom"></i>
              {{"Exportar" | translate}}
            </button>
          </div>
        </div>
      </div>

      <div class="card-header border border-dashed border-end-0 border-start-0">
        <form (ngSubmit)="applyFilters()">
          <div class="row g-1">
            <div class="col-xxl-3 col-md-6 col-sm-6">
              <div class="search-box">
                <input type="text" class="form-control search" name="searchTerm"
                  placeholder="Buscar contribuyentes ..."
                  [(ngModel)]="searchTerm" (ngModelChange)="performSearch()">
                <i class="ri-search-line search-icon"></i>
              </div>
            </div>
            <div class="col-xxl-2 col-md-3 col-sm-3">
              <select class="form-control" data-choices data-choices-search-false 
                name="estadoUsuario" id="idEstadoUsuario" [(ngModel)]="estadoUsuario">
                <option value="" selected>Estado Usuario</option>
                <option value="Activo">Activo</option>
                <option value="Bloqueado">Bloqueado</option>
                <option value="Pendiente">Pendiente</option>
              </select>
            </div>
            <div class="col-xxl-2 col-md-3 col-sm-3">
              <select class="form-control" data-choices data-choices-search-false 
                name="estadoRuat" id="idEstadoRuat" [(ngModel)]="estadoRuat">
                <option value="" selected>Estado Ruat</option>
                <option value="ACTIVO">Activo</option>
                <option value="INACTIVO">Inactivo</option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="BLOQUEADO">Bloqueado</option>
              </select>
            </div>
            <div class="col-xxl-2 col-md-3 col-sm-3">
              <select class="form-control" data-choices data-choices-search-false 
                name="tipoContribuyente" id="idTipoContribuyente" [(ngModel)]="tipoContribuyente">
                <option value="" selected>Tipo Contribuyente</option>
                <option value="NA">Natural</option>
                <option value="JU">Jurídico</option>
              </select>
            </div>
            <div class="col-xxl-2 col-md-3 col-sm-3">
              <select class="form-control" data-choices data-choices-search-false 
                name="puedeReservarGratis" id="idPuedeReservarGratis" [(ngModel)]="puedeReservarGratis">
                <option value="" selected>Reserva Gratis</option>
                <option value="SI">Sí</option>
                <option value="NO">No</option>
              </select>
            </div>
            <div class="col-xxl-1 col-md-3 col-sm-3">
              <button type="submit" class="btn btn-primary w-100">
                <i class="ri-equalizer-fill align-bottom"></i>
                Filtrar
              </button>
            </div>
          </div>
        </form>
      </div>

      <div class="card-header p-0">
        <div class="d-flex align-items-center gap-2">
          <ul ngbNav #nav="ngbNav" [activeId]="1" (navChange)="onNavChange($event)" 
            class="nav nav-tabs nav-tabs-custom nav-success mb-3" role="tablist">
            <li [ngbNavItem]="1" class="nav-item">
              <a ngbNavLink class="nav-link All py-3" data-bs-toggle="tab" id="All" 
                href="javascript:void(0);" role="tab" aria-selected="true">
                Todos los Contribuyentes<span class="badge bg-danger align-middle ms-1">{{temp.length}}</span>
              </a>
            </li>
            <li [ngbNavItem]="2" class="nav-item">
              <a ngbNavLink class="nav-link py-3 New" data-bs-toggle="tab" id="Naturales" 
                href="javascript:void(0);" role="tab" aria-selected="false">
                Contribuyentes Naturales
              </a>
            </li>
            <li [ngbNavItem]="3" class="nav-item">
              <a ngbNavLink class="nav-link py-3 Pending" data-bs-toggle="tab" id="Juridicos" 
                href="javascript:void(0);" role="tab" aria-selected="false">
                Contribuyentes Jurídicos
              </a>
            </li>
            <li [ngbNavItem]="4" class="nav-item">
              <a ngbNavLink class="nav-link py-3 Approved" data-bs-toggle="tab" id="ReservaGratis" 
                href="javascript:void(0);" role="tab" aria-selected="false">
                Puede Reservar Gratis
              </a>
            </li>
            <li [ngbNavItem]="5" class="nav-item">
              <a ngbNavLink class="nav-link py-3 Rejected" data-bs-toggle="tab" id="DeportistaElite" 
                href="javascript:void(0);" role="tab" aria-selected="false">
                Deportista Elite
              </a>
            </li>
            <li [ngbNavItem]="6" class="nav-item">
              <a ngbNavLink class="nav-link py-3 Rejected" data-bs-toggle="tab" id="Sancionados" 
                href="javascript:void(0);" role="tab" aria-selected="false">
                Sancionados
              </a>
            </li>
          </ul>
          <div class="hstack gap-2 ms-auto p-2 mb-2">
            <span class="dropdown d-md-inline-block" ngbDropdown>
              <button class="btn btn-soft-info btn-icon fs-14 arrow-none d-block" type="button"
                id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false" ngbDropdownToggle>
                <i class="ri-settings-4-line"></i>
              </button>
              <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1" ngbDropdownMenu>
                @for (column of itemsList; track column) {
                  <li class="dropdown-item p-1">
                    <div class="form-check form-check-outline form-check-primary">
                      <input class="form-check-input" type="checkbox" [id]="'formCheck' + column.prop"
                        [(ngModel)]="column.visible">
                      <label class="form-check-label" [for]="'formCheck' + column.prop">
                        {{column.name}}
                      </label>
                    </div>
                  </li>
                }
              </ul>
            </span>
          </div>
        </div>
      </div>

      <div class="card-body pt-0">
        <app-data-table
          [loading]="loading"
          [itemsList]="itemsList"
          [allcontent]="contribuyentesList"
          [actions]="{
            show: canActivate.includes('VER'),
            edit: canActivate.includes('ACTUALIZAR'),
            close: canActivate.includes('BLOQUEAR') ? 'Bloquear' : '',
            check: canActivate.includes('BLOQUEAR') ? 'Desbloquear' : '',
            process: canActivate.includes('ACTUALIZAR') ? 'Sancionar' : '',
          }"
          (showItemEmitter)="openModal($event,'show','md')"
          (editItemEmitter)="openModal($event,'edit','lg')"
          (closeItemEmitter)="openModal($event,'block','md')"
          (checkItemEmitter)="openModal($event,'unblock','md')"
          (processItemEmitter)="openModal($event,'sanction','md')"
          [multiCheck]="canActivate.includes('CREAR')"
          (selectedItemEmitter)="getSelectedItems($event)"
          [viewMode]="viewMode">
        </app-data-table>
      </div>
    </div>
  </div>
</div>
