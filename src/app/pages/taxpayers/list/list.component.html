<!-- Start Breadcrumbs -->
<app-breadcrumbs [title]="title | translate" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
    <div class="col-lg-12">
        <div class="card" id="customerList">
            <div class="card-header border-bottom-dashed">

                <div class="row g-4 align-items-center">
                    <div class="col-sm">
                        <div>
                            <h5 class="card-title mb-0">Lista de Contribuyentes</h5>
                        </div>
                    </div>
                    <div class="col-sm-auto">
                        <div class="d-flex flex-wrap align-items-start gap-2">
                            <button class="btn btn-soft-danger" id="remove-actions" style="display: none"
                                (click)="deleteMultiple(deleteModel)"><i class="ri-delete-bin-2-line"></i>
                            </button>
                            <button type="button" class="btn btn-secondary add-btn" data-bs-toggle="modal" 
                                (click)="openModal(undefined,'','lg')">
                                <i class="ri-add-circle-line align-middle"></i> 
                                {{"Agregar" | translate}}
                            </button>
                            <button type="button" class="btn btn-soft-success" (click)="csvFileExport()"><i
                                    class="ri-file-download-line align-bottom me-1"></i> Exportar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body border-bottom-dashed border-bottom">
                <div class="row g-3">
                    <div class="col-xl-6">
                        <div class="search-box">
                            <input type="text" name="searchTerm" class="form-control"
                                placeholder="Buscar por Nombre, Carnet o email ..."
                                [(ngModel)]="searchTerm" (ngModelChange)="performSearch()">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xl-6">
                        <div class="row g-3">
                            <div class="col-sm-4">
                                <div class="">
                                    <input class="form-control flatpickr-input" type="text" mwlFlatpickr
                                        [altInput]="true" [convertModelValue]="true" placeholder="Select date"
                                        id="isDate" [(ngModel)]="filterDate" (change)="dateFilter()" mode="range">
                                </div>
                            </div>
                            <!--end col-->
                            <div class="col-sm-4">
                                <div>
                                    <select class="form-control" data-plugin="choices" data-choices
                                        data-choices-search-false name="choices-single-default" id="idStatus"
                                        [(ngModel)]="status" (ngModelChange)="statusFilter()">
                                        <option value="" selected>Seleccionar Estado</option>
                                        <option value="Active">Activo</option>
                                        <option value="Block">Bloqueado</option>
                                    </select>
                                </div>
                            </div>
                            <!--end col-->

                            <div class="col-sm-4">
                                <div>
                                    <button type="button" class="btn btn-primary w-100"><i
                                            class="ri-equalizer-fill mx-2 align-bottom"></i>Filtrar</button>
                                </div>
                            </div>
                            <!--end col-->
                        </div>
                    </div>
                </div>
                <!--end row-->
            </div>
            <div class="card-body">
                <app-data-table
                    [loading]="loading"
                    [listaItems]="listaItems"
                    [content]="contribuyentesList"
                    [allcontent]="contribuyentesList"
                    [sortField]="searchTerm"
                    [show]="canActivate.includes('VER')"
                    [edit]="canActivate.includes('ACTUALIZAR')"
                    [delete]="canActivate.includes('ELIMINAR')"
                    (showItemEmitter)="viewDataGet($event)"
                    (editItemEmitter)="openModal($event,'edit','lg')"
                    (deleteItemEmitter)="deleteData($event)"              
                >
                </app-data-table>  
            </div>
        </div>

    </div>
    <!--end col-->
</div>
<!--end row-->

<!-- removeItemModal -->
<ng-template #deleteModel let-modal>
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="deleteRecord-close"
                (click)="modal.dismiss('Cross click')"></button>
        </div>
        <div class="modal-body">
            <div class="mt-2 text-center">
                <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop"
                    colors="primary:#f7b84b,secondary:#f06548" style="width:100px;height:100px"></lord-icon>
                <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
                    <h4>Are you sure ?</h4>
                    <p class="text-muted mx-4 mb-0">Are you sure you want to remove this record ?</p>
                </div>
            </div>
            <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
                <button type="button" class="btn w-sm btn-light" data-bs-dismiss="modal"
                    (click)="modal.close('Close click')">Close</button>
                <button type="button" class="btn w-sm btn-danger " id="delete-product" (click)="deleteData(deleteId)"
                    (click)="modal.close('Close click')">Yes, Delete It!</button>
            </div>
        </div>
    </div><!-- /.modal-content -->
</ng-template>
