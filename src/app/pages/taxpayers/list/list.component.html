<!-- Start Breadcrumbs -->
<app-breadcrumbs [title]="title | translate" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->

<div class="row">
    <div class="col-lg-12">
        <div class="card" *ngIf="canActivate.includes('CREAR') || (canActivate.includes('EXPORTAR') && selectedItems.length>0)">
            <div class="card-header">
                <div class="d-flex align-items-center flex-wrap gap-2">
                    <div class="flex-grow-1">
                        <button *ngIf="canActivate.includes('CREAR')" (click)="openModal(undefined,'','lg')"
                          type="button" class="btn btn-secondary add-btn" data-bs-toggle="modal">
                          <i class="ri-add-circle-line align-middle"></i> 
                          {{"Agregar" | translate}}
                        </button>
                    </div>
                    <div class="flex-shrink-0">
                        <div class="hstack text-nowrap gap-2" ngbDropdown>
                            <button class="btn btn-soft-info" id="remove-actions" style="display: none"
                              (click)="csvFileExport()">
                              <i class="ri-file-download-line align-bottom me-1"></i>Exportar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box">
                            <input type="text" name="searchTerm" class="form-control"
                                placeholder="Buscar por Nombre o Carnet ..."
                                [(ngModel)]="searchTerm" (ngModelChange)="performSearch()">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                    <div class="col-md-auto ms-auto">
                        <div class="d-flex align-items-center gap-2">
                            <select class="form-control" data-plugin="choices" data-choices
                                data-choices-search-false name="choices-single-default" id="idStatus"
                                [(ngModel)]="status" (ngModelChange)="statusFilter()">
                                <option value="" selected>Filtrar por Estado</option>
                                <option value="Activo">Activo</option>
                                <option value="Bloqueado">Bloqueado</option>
                            </select>
                            <div class="hstack gap-2">
                                <span class="dropdown" ngbDropdown>
                                    <button class="btn btn-soft-info btn-icon fs-14 arrow-none d-block" type="button"
                                        id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false"
                                        ngbDropdownToggle>
                                        <i class="ri-settings-4-line"></i>
                                    </button>
                                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1" ngbDropdownMenu>
                                      @for (column of itemsList; track $index) {             
                                        <li class="dropdown-item p-1">
                                          <div class="form-check form-check-outline form-check-primary">
                                            <input class="form-check-input" type="checkbox" [id]="'formCheck' + column.prop"
                                               [(ngModel)]="column.visible" (change)="toggleColumn(column)">
                                            <label class="form-check-label" [for]="'formCheck' + column.prop">
                                              {{column.name}}
                                            </label>
                                          </div>
                                        </li>                            
                                      }
                                    </ul>
                                </span>
                            </div>                            
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <app-data-table
                    [loading]="loading"
                    [itemsList]="itemsList"
                    [allcontent]="temp"
                    [content]="contribuyentesList"
                    [show]="canActivate.includes('VER')"
                    [edit]="canActivate.includes('ACTUALIZAR')"
                    [delete]="canActivate.includes('BLOQUEAR')"
                    (showItemEmitter)="openModal($event,'show','md')"
                    (editItemEmitter)="openModal($event,'edit','lg')"
                    (deleteItemEmitter)="openModal($event,'delete','md')"   
                    (selectedItemEmitter)="getSelectedItems($event)"    
                >
                </app-data-table>  
            </div>
        </div>
    </div>
</div>
