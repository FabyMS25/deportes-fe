<app-breadcrumbs [title]="'Reporte de ' + title" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header border-0">
                <h5 class="card-title mb-3 flex-grow-1">Reporte de Reservas</h5>
                <div>
                    <form (ngSubmit)="applyFilters()">
                        <div class="row g-3">
                            <div class="col-xxl-2 col-sm-6">
                                <div>
                                    <select class="form-control" name="reportType" [(ngModel)]="reportType">
                                        <option *ngFor="let type of reportTypes" [value]="type.value">
                                            {{type.label}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-xxl-2 col-sm-6">
                                <div>
                                    <input type="text" 
                                        class="form-control" 
                                        mwlFlatpickr 
                                        placeholder="Intervalo de Fechas" 
                                        name="date"
                                        [convertModelValue]="true"     
                                        mode="range"                                 
                                        [(ngModel)]="date"                                     
                                        [altInput]="true"
                                        [altFormat]="'F j, Y'"
                                        dateFormat="Y-m-d"
                                        [locale]="Spanish"
                                        required>                             
                                </div>
                            </div>
                            <div class="col-xxl-2 col-sm-4">
                                <div>
                                    <select class="form-control" name="cancha" [(ngModel)]="cancha">
                                        <option value="TODO">Todos los complejos</option>
                                        <option *ngFor="let complejo of complejosList" [value]="complejo.nombre">
                                            {{complejo.nombre}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-xxl-2 col-sm-4">
                                <div>
                                    <select class="form-control" name="paymentType" [(ngModel)]="paymentType">
                                        <option *ngFor="let option of paymentTypeOptions" [value]="option.value">
                                            {{option.label}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-xxl-2 col-sm-4">
                                <div>
                                    <select class="form-control" name="status" [(ngModel)]="status">
                                        <option *ngFor="let option of statusOptions" [value]="option.value">
                                            {{option.label}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-xxl-2 col-sm-4">
                                <div>
                                    <button type="submit" class="btn btn-primary w-100" [disabled]="showLoading">
                                        <i class="ri-equalizer-fill mx-1 align-bottom"></i>
                                        <span *ngIf="!showLoading">Generar</span>
                                        <span *ngIf="showLoading">Generando...</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>            
            
            <div class="card-body border border-dashed border-end-0 border-start-0">
                <div class="row mb-3">
                    <div class="col-12">
                        <div class="alert alert-info mb-0">
                            <i class="ri-information-line align-middle"></i>
                            <strong>Reporte:</strong> 
                            {{ reportType === 'puntual' ? 'Reservas Puntuales' : 'Reservas Recurrentes' }}
                            | <strong>Complejo:</strong> {{ getCanchaLabel(cancha) }}
                            | <strong>Estado:</strong> {{ getStatusLabel(status) }}
                            | <strong>Tipo de Cobro:</strong> {{ getPaymentTypeLabel(paymentType) }}
                        </div>
                    </div>
                </div>
                
                <div class="col-12" style="height: 430px;">
                    <object #pdfViewer type="application/pdf" width="100%" height="100%">
                        <div class="text-center p-5 bg-light">
                            <i class="ri-file-pdf-line display-4 text-muted"></i>
                            <p class="mt-2 text-muted">El reporte se mostrará aquí después de generarlo</p>
                        </div>
                    </object>                         
                </div>
                
                <div id="elmLoader" *ngIf="showLoading" class="text-center mt-3">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-2 text-muted">Generando reporte, por favor espere...</p>
                </div> 
            </div>
        </div>
    </div>
</div>
