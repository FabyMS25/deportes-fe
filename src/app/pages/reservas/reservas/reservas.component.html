<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Reservas" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->




<div class="row">
    <div class="col-lg-12">
        <div class="card" id="applicationList">
            <div class="card-header  border-0">
                <div class="d-md-flex align-items-center">
                    <h5 class="card-title mb-3 mb-md-0 flex-grow-1">Lista de Reservas</h5>
                    <div class="flex-shrink-0">
                        <div class="d-flex gap-1 flex-wrap">
                            <button type="button" class="btn btn-primary add-btn" data-bs-toggle="modal" id="create-btn" data-bs-target="#showModal" (click)="openModal(undefined,'','')"><i class="ri-add-line align-bottom me-1"></i>
                                Agregar</button>
                            <button type="button" class="btn btn-secondary"><i class="ri-file-download-line align-bottom me-1"></i> Importar</button>
                            <button class="btn btn-soft-danger" id="remove-actions" (click)="confirm(deletemodal,'')"><i class="ri-delete-bin-2-line"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body border border-dashed border-end-0 border-start-0">
                <!-- <form> -->
                <div class="row g-3">
                    <div class="col-xxl-5 col-sm-6">
                        <div class="search-box">
                            <input type="text" class="form-control search" placeholder="Buscar reservas ..." [(ngModel)]="searchTerm" (ngModelChange)="performSearch()">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-6">
                        <div>
                            <input type="text" class="form-control" mwlFlatpickr [convertModelValue]="true" placeholder="Select date" [(ngModel)]="date" mode="range">
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-4">
                        <div>
                            <select class="form-control" data-choices data-choices-search-false name="choices-single-default" id="idStatus" [(ngModel)]="status" (ngModelChange)="statusFilter()">
                                <option value="">Estado</option>
                                <option value="" selected>All</option>
                                <option value="Approved">Approved</option>
                                <option value="New">New</option>
                                <option value="Pending">Pending</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-4">
                        <div>
                            <select class="form-control" data-choices data-choices-search-false name="choices-single-default" id="idType" [(ngModel)]="type" (ngModelChange)="typeFilter()">
                                <option value="">Select Type</option>
                                <option value="" selected>All</option>
                                <option value="Full Time">Full Time</option>
                                <option value="Part Time">Part Time</option>
                            </select>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-1 col-sm-4">
                        <div>
                            <button type="button" class="btn btn-success w-100"> <i class="ri-equalizer-fill mx-1 align-bottom"></i>
                                Filtrar
                            </button>
                        </div>
                    </div>
                    <!--end col-->
                </div>
                <!--end row-->
                <!-- </form> -->
            </div>

            <div class="card-body pt-0">
                <div>
                    <ul ngbNav #nav="ngbNav" [activeId]="1" (navChange)="onNavChange($event)" class="nav nav-tabs nav-tabs-custom nav-success mb-3" role="tablist">
                        <li [ngbNavItem]="1" class="nav-item">
                            <a ngbNavLink class="nav-link All py-3" data-bs-toggle="tab" id="All" href="javascript:void(0);" role="tab" aria-selected="true">
                                Todas las Reservas
                            </a>
                        </li>
                        <li [ngbNavItem]="2" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 New" data-bs-toggle="tab" id="Nuevo" href="javascript:void(0);" role="tab" aria-selected="false">
                                Nuevos
                            </a>
                        </li>
                        <li [ngbNavItem]="3" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Pending" data-bs-toggle="tab" id="Pendiente" href="javascript:void(0);" role="tab" aria-selected="false">
                                Pendiente <span class="badge bg-danger align-middle ms-1">2</span>
                            </a>
                        </li>
                        <li [ngbNavItem]="4" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Approved" data-bs-toggle="tab" id="Vencido" href="javascript:void(0);" role="tab" aria-selected="false">
                                Vencido
                            </a>
                        </li>
                        <li [ngbNavItem]="5" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Rejected" data-bs-toggle="tab" id="Rechazado" href="javascript:void(0);" role="tab" aria-selected="false">
                                Rechazado
                            </a>
                        </li>
                    </ul>
                    <app-data-table
                        [loading]="loading"
                        [listaItems]="listaItems"
                        [content]="reservasList"
                        [allcontent]="reservasList"
                        [sortField]="searchTerm"
                        [show]="canActivate.includes('VER')"
                        [edit]="canActivate.includes('ACTUALIZAR')"
                        [delete]="canActivate.includes('ELIMINAR')"
                        (showItemEmitter)="openModal($event,'show','md')"
                        (editItemEmitter)="openModal($event,'edit','md')"
                        (deleteItemEmitter)="deleteData($event)"              
                    >
                    </app-data-table>        
                </div>


                <!-- Modal -->

                <ng-template #deletemodal role="document" let-modal>
                    <div class="modal-body p-5 text-center">
                        <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop" colors="primary:#405189,secondary:#f06548" style="width:90px;height:90px">
                        </lord-icon>
                        <div class="mt-4 text-center">
                            <h4>You are about to delete a order ?</h4>
                            <p class="text-muted fs-15 mb-4">Deleting your order will remove all of your
                                information from our database.</p>
                            <div class="hstack gap-2 justify-content-center remove">
                                <button class="btn btn-link link-success fw-medium text-decoration-none" id="deleteRecord-close" data-bs-dismiss="modal" (click)="modal.dismiss('close click')"><i class="ri-close-line me-1 align-middle"></i> Close</button>
                                <button class="btn btn-danger" id="delete-record" (click)="deleteData(deleteId)">Yes,
                                    Delete
                                    It</button>
                            </div>
                        </div>
                    </div>
                </ng-template>
                <!--end modal -->
            </div>
        </div>

    </div>
    <!--end col-->
</div>
