<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Reservas" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<!-- End Breadcrumbs -->




<div class="row">
    <div class="col-lg-12">
        <div class="card" id="applicationList">
            <div class="card-header  border-0">
                <div class="d-md-flex align-items-center">
                    <h5 class="card-title mb-3 mb-md-0 flex-grow-1">Lista de Reservas</h5>
                    <div class="flex-shrink-0">
                        <div class="d-flex gap-1 flex-wrap">
                            <button type="button" class="btn btn-secondary add-btn" data-bs-toggle="modal" 
                                (click)="openModal(undefined,'','lg')">
                                <i class="ri-add-circle-line align-middle"></i> 
                                {{"Agregar" | translate}}
                            </button>
                            <button type="button" class="btn btn-soft-info" (click)="csvFileExport()"><i
                                    class="ri-file-download-line align-bottom me-1"></i> Exportar</button>
                            <button class="btn btn-soft-primary" id="remove-actions" (click)="checkedMultiple(consultModel)">
                                <i class="ri-restart-fill fs-16 "></i> Consultar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Filters -->
            <div class="card-body border border-dashed border-end-0 border-start-0">
                <!-- <form> -->
                <div class="row g-3">
                    <div class="col-xxl-5 col-sm-6">
                        <div class="search-box">
                            <input type="text" class="form-control search" placeholder="Buscar reservas ..." [(ngModel)]="searchTerm" (ngModelChange)="performSearch()">
                            <i class="ri-search-line search-icon"></i>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-6">
                        <div>
                            <input type="text" class="form-control" mwlFlatpickr [convertModelValue]="true" placeholder="Select date" [(ngModel)]="date" mode="range">
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-4">
                        <div>
                            <select class="form-control" data-choices data-choices-search-false name="choices-single-default" id="idStatus" [(ngModel)]="status" (ngModelChange)="statusFilter()">
                                <option value="">Estado</option>
                                <option value="" selected>Todo</option>
                                
                                <option value="Pendiente">Pendiente</option>
                                <option value="Pagado">Pagado</option>
                            </select>
                        </div>
                    </div>
                    <!--end col-->
                    <div class="col-xxl-2 col-sm-4">
                        <div>
                            <select class="form-control" data-choices data-choices-search-false name="choices-single-default" id="idType" [(ngModel)]="type" (ngModelChange)="typeFilter()">
                                <option value="">Tipo de Cobro</option>
                                <option value="" selected>Todo</option>
                                <option value="hora">Hora</option>
                                <option value="Persona">Persona</option>
                                <option value="Evento">Evento</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-xxl-1 col-sm-4">
                        <div>
                            <button type="button" class="btn btn-primary w-100"> <i class="ri-equalizer-fill mx-1 align-bottom"></i>
                                Filtrar
                            </button>
                        </div>
                    </div>
                </div>
                <!--end row-->
                <!-- </form> -->
            </div>
            
            <div class="card-body pt-0">
                <div>
                    <ul ngbNav #nav="ngbNav" [activeId]="1" (navChange)="onNavChange($event)" class="nav nav-tabs nav-tabs-custom nav-success mb-3" role="tablist">
                        <li [ngbNavItem]="1" class="nav-item">
                            <a ngbNavLink class="nav-link All py-3" data-bs-toggle="tab" id="All" href="javascript:void(0);" role="tab" aria-selected="true">
                                Todas las Reservas
                            </a>
                        </li>
                        <li [ngbNavItem]="2" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 New" data-bs-toggle="tab" id="Pendiente" href="javascript:void(0);" role="tab" aria-selected="false">
                                Pendiente<span class="badge bg-danger align-middle ms-1">2</span>
                            </a>
                        </li>
                        <li [ngbNavItem]="3" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Pending" data-bs-toggle="tab" id="Pagado" href="javascript:void(0);" role="tab" aria-selected="false">
                                Pagado 
                            </a>
                        </li>
                        <li [ngbNavItem]="4" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Approved" data-bs-toggle="tab" id="Vencido" href="javascript:void(0);" role="tab" aria-selected="false">
                                Vencido
                            </a>
                        </li>
                        <li [ngbNavItem]="5" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Rejected" data-bs-toggle="tab" id="Anulado" href="javascript:void(0);" role="tab" aria-selected="false">
                                Anulado
                            </a>
                        </li>
                    </ul>
                    <app-data-table
                        [loading]="loading"
                        [listaItems]="listaItems"
                        [content]="reservasList"
                        [allcontent]="reservasList"
                        [sortField]="searchTerm"
                        [show]="canActivate.includes('VER')"
                        [edit]="canActivate.includes('ACTUALIZAR')"
                        [delete]="canActivate.includes('ANULAR')"
                        [consult]="true"
                        [delete]="true"
                        (showItemEmitter)="openModal($event,'show','md')"
                        (editItemEmitter)="openModal($event,'edit','md')"
                        (consultItemEmitter)="consultModal(consultModel,$event)"    
                        (deleteItemEmitter)="deleteModal(annularModel,$event)"     
                        (seleccionarItemEmitter)="getSeleccionados($event)">   
                    >
                    </app-data-table>        
                </div>
            </div>
        </div>
    </div>
    <!--end col-->
</div>

<!-- Modals -->
<ng-template #consultModel role="document" let-modal>
    <div class="modal-content">
      <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="btn-close" (click)="modal.dismiss('Cross click')"></button>
      </div>
      <div class="text-center">
        <div class="mt-3">
            <div class="avatar-lg mx-auto">
                <div class="avatar-title bg-light text-success display-5 rounded-circle">
                    <i class=" ri-bubble-chart-line"></i>
                </div>
            </div>
            <div class="mt-4 pt-2 fs-15">
                <h4 class="fs-20 fw-semibold">Se realizo la Consulta!</h4>
                <p class="text-muted mb-0 mt-3 fs-13">We have sent you verification email <span class="fw-medium text-body">exampleabc.com</span>, <br> Please check it.</p>
            </div>
        </div>
        <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
            <button type="button" class="swal2-confirm btn btn-primary mb-1" aria-label="" (click)="modal.dismiss('Cross click')">OK</button>
        </div>
        <div class="swal2-footer" *ngIf="pago">
            <p class="fs-14 text-muted">{{pago.nroTasa}}</p>
        </div>
      </div>
    </div><!-- /.modal-content -->
</ng-template>
<!-- removeItemModal -->
<ng-template #annularModel let-modal>
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="btn-close"
                (click)="modal.dismiss('Cross click')"></button>
        </div>
        <div class="modal-body">
            <div class="mt-2 text-center">
                <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop"
                    colors="primary:#405189,secondary:#f06548" style="width:90px;height:90px"></lord-icon>
                <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
                    <h4>Estas seguro de Anular la Reserva?</h4>
                    <p class="text-muted mx-4 mb-0">
                        Al Confirmar no podra reactivar esta reserva nuevamente.
                    </p>
                </div>
            </div>
            <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
                <button class="btn btn-link link-success fw-medium text-decoration-none" data-bs-dismiss="modal"
                    id="deleteRecord-close" (click)="modal.close('Close click')"><i
                        class="ri-close-line me-1 align-middle"></i> Cancelar</button>
                <button type="button" class="btn w-sm btn-danger " id="delete-product" (click)="annularData(dataSelected)"
                    (click)="modal.close('Close click')">Si, Anular!</button>
            </div>
        </div>
    </div>
</ng-template>
<!--end modal -->
