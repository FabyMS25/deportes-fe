<app-breadcrumbs [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="content">
  <app-data-header
    [breadcrumbItems]="breadCrumbItems"
    [csvItems]="csvExportItems"
    [loadExportItems]="loadExportItems"
    [csvColumns]="CSV_COLUMNS"
    [SelectedItems]="selectedItems"
    [newShow]="canActivate.includes('CREAR')"
    [exportShow]="canActivate.includes('VER')"
    (createEmitter)="openForm()"
  ></app-data-header>

  <div class="card rounded-2">
    <div class="card-header border border-dashed border-end-0 border-start-0">
      <div class="bg-danger-subtle text-danger rounded-3 justify-content-center align-items-center p-2"  *ngIf="contribuyente && contribuyente.estadoUsuario !== 'ACTIVO'">
          <h4 class="text-danger text-center">Su cuenta no se encuentra activa, solo puede ver el historial de sus reservas y no realizar reservas nuevas</h4>
          <p class="text-center"> para reactivar su cuenta comuniquese con el administrador</p>
      </div>
      <div class="row g-2">
        <div class="col-12 col-sm-4 col-lg-4">
          <div class="search-box">
            <input type="text" class="form-control search" name="searchTerm"
                   placeholder="Buscar organización, contribuyente o número..."
                   [(ngModel)]="filters.searchTerm" (ngModelChange)="onSearchChange()">
            <i class="ri-search-line search-icon"></i>
          </div>
        </div>
        <div class="col-6 col-sm-4 col-lg-3">
          <select class="form-control" data-choices data-choices-search-false
                  name="organization" id="idBorderouxOrganization"
                  [(ngModel)]="filters.organization" (ngModelChange)="applyFilters()">
            <option value="" selected>Organización</option>
            <option *ngFor="let org of escuelasList" [value]="org.uuid">
              {{ org.nombre }}
            </option>
          </select>
        </div>
        <div class="col-6 col-sm-3 col-lg-3">
          <select class="form-control" data-choices data-choices-search-false
                  name="estadoReserva" id="idBorderouxEstado"
                  [(ngModel)]="filters.estadoReserva" (ngModelChange)="applyFilters()">
            <option value="" selected>Estado de liquidación</option>
            <option *ngFor="let option of estadoReservaOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>
        <div class="col-6 col-sm-1 col-lg-2">
          <button class="btn btn-outline-secondary w-100" type="button"
                  title="Limpiar todos los filtros" aria-label="Limpiar todos los filtros"
                  (click)="clearFilters()">
            <i class="ri-refresh-line align-bottom"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="card-header p-0">
      <div class="row g-2">
        <div class="col-auto flex-grow-1">
          <ul ngbNav #nav="ngbNav" [activeId]="filters.tab"
              (navChange)="onNavChange($event)"
              class="nav nav-tabs nav-tabs-custom nav-success" role="tablist">
            <li [ngbNavItem]="0" class="nav-item">
              <a ngbNavLink class="nav-link py-3">Todo</a>
            </li>
            <li [ngbNavItem]="1" class="nav-item">
              <a ngbNavLink class="nav-link py-3">Pendientes de Pago</a>
            </li>
            <li [ngbNavItem]="2" class="nav-item">
              <a ngbNavLink class="nav-link py-3">Pagadas</a>
            </li>
            <li [ngbNavItem]="5" class="nav-item">
              <a ngbNavLink class="nav-link py-3">Canceladas</a>
            </li>
          </ul>
        </div>
        <div class="col-auto ms-auto d-flex justify-content-end align-items-center gap-2">
          <button class="btn btn-soft-secondary btn-sm d-flex align-items-center"
                  type="button" (click)="toggleViewMode()">
            <i *ngIf="viewMode === 'table'" class="ri-grid-fill me-1"></i>
            <i *ngIf="viewMode === 'cards'" class="ri-list-check me-1"></i>
            <span>{{ viewMode === 'cards' ? 'Lista' : 'Grid' }}</span>
          </button>
          <div class="hstack ms-auto">
            <span class="dropdown d-md-inline-block" ngbDropdown>
              <button type="button" class="btn btn-soft-info btn-sm arrow-none"
                      id="borderouxColumnsDropdown" data-bs-toggle="dropdown" ngbDropdownToggle>
                <i class="ri-settings-4-line"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="borderouxColumnsDropdown"
                  ngbDropdownMenu>
                <li class="dropdown-item p-1" *ngFor="let column of columnsList; trackBy: trackByColumn">
                  <div class="form-check form-check-outline form-check-primary">
                    <input class="form-check-input" type="checkbox" [id]="'borderouxCol' + column.prop"
                           [(ngModel)]="column.visible">
                    <label class="form-check-label" [for]="'borderouxCol' + column.prop">
                      {{ column.name }}
                    </label>
                  </div>
                </li>
              </ul>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <app-data-table
        [loading]="loading"
        [itemsList]="columnsList"
        [allcontent]="borderouxList"
        [serverSidePagination]="true"
        [paginationInfo]="{
          pageNumber: currentPage - 1,
          pageSize: pageSize,
          totalElements: borderouxList?.totalElements,
          totalPages: borderouxList?.totalPages,
          first: borderouxList?.first,
          last: borderouxList?.last
        }"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (sortChange)="onSortChange($event)"
        [actions]="{ show: canActivate.includes('VER') }"
        [multiCheck]="false"
        [emptyMessage]="'No hay liquidaciones Borderoux registradas.'"
        emptyDescription="Registre la primera liquidación con el botón Nueva liquidación."
        (showItemEmitter)="openForm($event)"
        (selectedItemEmitter)="getSelectedItems($event)"
        [viewMode]="viewMode">
      </app-data-table>
    </div>
  </div>
</div>
