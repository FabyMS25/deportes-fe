<app-breadcrumbs [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="content">
    <app-data-header
        [breadcrumbItems]="breadCrumbItems"
        [csvItems]="csvExportItems"
        [loadExportItems]="loadExportItems"
        [csvColumns]="CSV_COLUMNS"
        [SelectedItems]="selectedItems"
        [newShow]="canActivate.includes('CREAR')"
        [consultShow]="false"
        [exportShow]="canActivate.includes('VER')"
        (createEmitter)="createNewMonthlyPayment()"
    ></app-data-header>
    <div class="card rounded-2">
        <div class="card-header border border-dashed border-end-0 border-start-0">
            <div class="bg-danger-subtle text-danger rounded-3 justify-content-center align-items-center p-2"  *ngIf="contribuyente && contribuyente.estadoUsuario !== 'ACTIVO'">
                <h4 class="text-danger text-center">Su cuenta no se encuentra activa, solo puede ver el historial de pagos</h4>
                <p class="text-center">Para reactivar su cuenta comuníquese con el administrador</p>
            </div>
            <div class="row g-2">
                <div class="col-6 col-sm-3 col-lg-3">
                    <div class="search-box">
                        <input type="text" class="form-control search" name="searchTerm"
                            placeholder="Buscar estudiante, matrícula, período..."
                            [(ngModel)]="filters.searchTerm" (ngModelChange)="onSearchChange()">
                            <i class="ri-search-line search-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-sm-3 col-lg-2">
                    <select class="form-control" data-choices data-choices-search-false 
                            name="periodoMes" id="idPeriodoMes"
                            [(ngModel)]="selectedMesFiltro" (ngModelChange)="applyPeriodoFilters()">
                        <option [ngValue]="undefined">Todos los meses</option>
                        <option *ngFor="let month of periodMonths" [ngValue]="month.value">
                          {{ month.label }}
                        </option>
                    </select>
                </div>
                <div class="col-6 col-sm-3 col-lg-2">
                    <select class="form-control" data-choices data-choices-search-false
                            name="periodoAnio" id="idPeriodoAnio"
                            [(ngModel)]="selectedAnioFiltro" (ngModelChange)="applyPeriodoFilters()">
                        <option [ngValue]="undefined">Todos los años</option>
                        <option *ngFor="let year of periodYears" [ngValue]="year">
                          {{ year }}
                        </option>
                    </select>
                </div>
                <div class="col-6 col-sm-3 col-lg-2">
                    <select class="form-control" data-choices data-choices-search-false name="estadoReserva" id="idEstadoReserva"
                        [(ngModel)]="filters.estadoReserva" (ngModelChange)="applyFilters()">
                        <option value="" selected>Estado Reserva</option>
                        <option *ngFor="let option of estadoReservaOptions" [value]="option.value">
                            {{option.label}}
                        </option>
                    </select>
                </div>
                <div class="col-6 col-sm-3 col-lg-2">
                    <select class="form-control" data-choices data-choices-search-false
                            name="escuela" id="idEscuela" 
                            [(ngModel)]="filters.organization" (ngModelChange)="applyFilters()">
                        <option value="" selected>Organización/Escuela</option>
                        <option *ngFor="let escuela of escuelasList" [value]="escuela.uuid">
                            {{escuela.nombre}}
                        </option>
                    </select>
                </div>
                <div class="col-6 col-sm-3 col-lg-1">
                    <button class="btn btn-outline-secondary w-100" 
                        title="Limpiar" (click)="clearFilters()">
                        <i class="ri-refresh-line align-bottom"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="card-header p-0">
            <div class="row g-2">
                <div class="col-auto flex-grow-1">
                    <ul ngbNav #nav="ngbNav" [activeId]="filters.tab"
                        (navChange)="onNavChange($event)"
                        class="nav nav-tabs nav-tabs-custom nav-success"
                        role="tablist">
                        <li [ngbNavItem]="0" class="nav-item">
                            <a ngbNavLink class="nav-link All py-3" data-bs-toggle="tab" id="All" href="javascript:void(0);" role="tab" aria-selected="true">
                            Todo<span class="badge bg-danger align-middle ms-1">{{temp.length || 0}}</span>
                            </a>
                        </li>
                        <li [ngbNavItem]="1" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 New" data-bs-toggle="tab" id="Pendientes" href="javascript:void(0);" role="tab" aria-selected="false">
                            Pendientes de Pago
                            </a>
                        </li>
                        <li [ngbNavItem]="2" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Pending" data-bs-toggle="tab" id="Pagadas" href="javascript:void(0);" role="tab" aria-selected="false">
                            Pagadas
                            </a>
                        </li>
                        <li [ngbNavItem]="3" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Approved" data-bs-toggle="tab" id="EnCurso" href="javascript:void(0);" role="tab" aria-selected="false">
                            Vigentes
                            </a>
                        </li>
                        <li [ngbNavItem]="4" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Completed" data-bs-toggle="tab" id="Completadas" href="javascript:void(0);" role="tab" aria-selected="false">
                            Completadas
                            </a>
                        </li>
                        <li [ngbNavItem]="5" class="nav-item">
                            <a ngbNavLink class="nav-link py-3 Rejected" data-bs-toggle="tab" id="Canceladas" href="javascript:void(0);" role="tab" aria-selected="false">
                            Canceladas
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="col-auto ms-auto d-flex justify-content-end align-items-center gap-2">
                    <button class="btn btn-soft-secondary btn-sm d-flex align-items-center"
                                (click)="toggleViewMode()">
                            <i *ngIf="viewMode === 'table'" class="ri-grid-fill me-1"></i>
                            <i *ngIf="viewMode === 'cards'" class="ri-list-check me-1"></i>
                            <span>{{ viewMode === 'cards' ? 'Lista' : 'Grid' }}</span>
                    </button>
                    <div class="hstack ms-auto">
                        <span class="dropdown d-md-inline-block" ngbDropdown>
                            <button type="button" class="btn btn-soft-info btn-sm arrow-none"
                            id="dropdownMenuButton1" data-bs-toggle="dropdown" ngbDropdownToggle>
                            <i class="ri-settings-4-line"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton1" ngbDropdownMenu>
                            @for (column of itemsList; track column) {
                                <li class="dropdown-item p-1">
                                <div class="form-check form-check-outline form-check-primary">
                                    <input class="form-check-input" type="checkbox" [id]="'formCheck' + column.prop"
                                        [(ngModel)]="column.visible">
                                    <label class="form-check-label" [for]="'formCheck' + column.prop">
                                        {{column.name}}
                                    </label>
                                </div>
                                </li>
                            }
                            </ul>
                        </span>
                    </div>
                </div>
          </div>
        </div>
        <div class="card-body">
            <div>
            <app-data-table
                [loading]="loading"
                [itemsList]="itemsList"
                [allcontent]="reservasList.content"
                [serverSidePagination]="true"
                [paginationInfo]="{
                    pageNumber: currentPage - 1,
                    pageSize: pageSize,
                    totalElements: reservasList?.totalElements,
                    totalPages: reservasList?.totalPages ,
                    first: reservasList?.first,
                    last: reservasList?.last
                }"
                (pageChange)="onPageChange($event)"
                (pageSizeChange)="onPageSizeChange($event)"
                [actions]="{
                    show: canActivate.includes('VER'),
                    consult: canActivate.includes('ACTUALIZAR'),
                    records: canActivate.includes('GENERAR TICKET'),
                    close: canActivate.includes('ANULAR')?'Anular':'',}"
                (showItemEmitter)="openModal($event,'show','lg')"
                (consultItemEmitter)="openModal($event,'consult','md')"
                (closeItemEmitter)="openModal($event,'annularModal','')"
                (recordsEmitter)="showTicket($event)"
                [multiCheck]="canActivate.includes('CREAR')"
                (selectedItemEmitter)="getSelectedItems($event)" 
                [viewMode]="viewMode">
            </app-data-table>
            </div>
        </div>
    </div>
</div>
