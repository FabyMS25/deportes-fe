<app-breadcrumbs [title]="title | translate" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="content">
    <app-data-header
        [title]="title"
        [newShow]="canActivate.includes('CREAR')"
        [exportShow]="canActivate.includes('VER')"
        (createEmitter)="openModal( undefined,'','lg')"
        (exportEmitter)="csvFileExport()"
    ></app-data-header>
    <div class="card rounded-2">
      <div class="card-header border border-dashed border-end-0 border-start-0">
        <form (ngSubmit)="applyFilters()">
          <div class="row g-2">
            <div class="col-6 col-sm-6 col-lg-3">
              <div class="search-box">
                <input type="text" class="form-control search" name="searchTerm"
                  placeholder="Buscar contribuyentes ..."
                  [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
                <i class="ri-search-line search-icon"></i>
              </div>
            </div>
            <div class="col-6 col-sm-6 col-lg-2">
              <select class="form-control" data-choices data-choices-search-false 
                name="estadoUsuario" id="idEstadoUsuario" [(ngModel)]="estadoUsuario">
                <option value="" selected>Estado Usuario</option>
                <option value="Activo">Activo</option>
                <option value="Bloqueado">Bloqueado</option>
                <option value="Pendiente">Pendiente</option>
              </select>
            </div>
            <div class="col-6 col-sm-6 col-lg-2">
              <select class="form-control" data-choices data-choices-search-false 
                name="estadoRuat" id="idEstadoRuat" [(ngModel)]="estadoRuat">
                <option value="" selected>Estado Ruat</option>
                <option value="ACTIVO">Activo</option>
                <option value="INACTIVO">Inactivo</option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="BLOQUEADO">Bloqueado</option>
              </select>
            </div>
            <div class="col-6 col-sm-6 col-lg-2">
              <select class="form-control" data-choices data-choices-search-false 
                name="tipoContribuyente" id="idTipoContribuyente" [(ngModel)]="tipoContribuyente">
                <option value="" selected>Tipo Contribuyente</option>
                <option value="NA">Natural</option>
                <option value="JU">Jurídico</option>
              </select>
            </div>
            <div class="col-6 col-sm-6 col-lg-2">
              <select class="form-control" data-choices data-choices-search-false 
                name="puedeReservarGratis" id="idPuedeReservarGratis" [(ngModel)]="puedeReservarGratis">
                <option value="" selected>Reserva Gratis</option>
                <option value="SI">Sí</option>
                <option value="NO">No</option>
              </select>
            </div>
            <div class="col-6 col-sm-6 col-lg-1">
              <button class="btn btn-primary w-100" 
                title="Filtrar" type="submit">
                <i class="ri-filter-line align-bottom"></i>
              </button>
            </div>
          </div>
        </form>
      </div>
      <div class="card-header p-0">
        <div class="row g-2">
          <div class="col-auto flex-grow-1">
            <ul ngbNav #nav="ngbNav" [activeId]="1" (navChange)="onNavChange($event)"
              class="nav nav-tabs nav-tabs-custom nav-success " role="tablist">
              <li [ngbNavItem]="1" class="nav-item">
                <a ngbNavLink class="nav-link py-2" data-bs-toggle="tab" id="All" 
                  href="javascript:void(0);" role="tab" aria-selected="true">
                  Todos<span class="badge bg-danger align-middle ms-1">{{temp.length}}</span>
                </a>
              </li>
              <li [ngbNavItem]="2" class="nav-item">
                <a ngbNavLink class="nav-link py-2 New" data-bs-toggle="tab" id="Naturales" 
                  href="javascript:void(0);" role="tab" aria-selected="false">
                  Naturales
                </a>
              </li>
              <li [ngbNavItem]="3" class="nav-item">
                <a ngbNavLink class="nav-link py-2 Pending" data-bs-toggle="tab" id="Juridicos" 
                  href="javascript:void(0);" role="tab" aria-selected="false">
                  Jurídicos
                </a>
              </li>
              <li [ngbNavItem]="4" class="nav-item">
                <a ngbNavLink class="nav-link py-2 Approved" data-bs-toggle="tab" id="ReservaGratis" 
                  href="javascript:void(0);" role="tab" aria-selected="false">
                  Puede Reservar Gratis
                </a>
              </li>
              <li [ngbNavItem]="5" class="nav-item">
                <a ngbNavLink class="nav-link py-2 Rejected" data-bs-toggle="tab" id="DeportistaElite" 
                  href="javascript:void(0);" role="tab" aria-selected="false">
                  Es Deportista Elite
                </a>
              </li>
              <li [ngbNavItem]="6" class="nav-item">
                <a ngbNavLink class="nav-link py-2 Rejected" data-bs-toggle="tab" id="Sancionados" 
                  href="javascript:void(0);" role="tab" aria-selected="false">
                  Sancionados
                </a>
              </li>
            </ul>
          </div>
          <div class="col-auto ms-auto d-flex justify-content-end align-items-center gap-2">
            <button class="btn btn-soft-secondary btn-sm d-flex align-items-center"
                    (click)="toggleViewMode()">
                <i *ngIf="viewMode === 'table'" class="ri-grid-fill me-1"></i>
                <i *ngIf="viewMode === 'cards'" class="ri-list-check me-1"></i>
                <span>{{ viewMode === 'cards' ? 'Lista' : 'Grid' }}</span>
            </button>
            <div class="hstack ms-auto">
              <span class="dropdown d-md-inline-block" ngbDropdown>
                <button type="button" class="btn btn-soft-info btn-sm arrow-none"
                   id="dropdownMenuButton1" data-bs-toggle="dropdown" ngbDropdownToggle>
                  <i class="ri-settings-4-line"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton1" ngbDropdownMenu>
                  @for (column of itemsList; track column) {
                    <li class="dropdown-item p-1">
                      <div class="form-check form-check-outline form-check-primary">
                        <input class="form-check-input" type="checkbox" [id]="'formCheck' + column.prop"
                            [(ngModel)]="column.visible">
                        <label class="form-check-label" [for]="'formCheck' + column.prop">
                            {{column.name}}
                        </label>
                      </div>
                    </li>
                  }
                </ul>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <app-data-table
          [loading]="loading"
          [itemsList]="itemsList"
          [allcontent]="contribuyentesList"
          [actions]="{
            show: canActivate.includes('VER'),
            edit: canActivate.includes('ACTUALIZAR'),
            close: canActivate.includes('BLOQUEAR') ? 'Bloquear' : '',
            check: canActivate.includes('BLOQUEAR') ? 'Desbloquear' : '',
            process: canActivate.includes('ACTUALIZAR') ? 'Sancionar' : '',
          }"
          (showItemEmitter)="openModal($event,'show','md')"
          (editItemEmitter)="openModal($event,'edit','lg')"
          (closeItemEmitter)="openModal($event,'block','md')"
          (checkItemEmitter)="openModal($event,'unblock','md')"
          (processItemEmitter)="openModal($event,'sanction','md')"
          [multiCheck]="canActivate.includes('CREAR')"
          (selectedItemEmitter)="getSelectedItems($event)"
          [viewMode]="viewMode">
        </app-data-table>
      </div>
    </div>
</div>
