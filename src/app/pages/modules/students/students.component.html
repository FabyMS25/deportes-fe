<app-breadcrumbs [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="content">
  <app-data-header
    [breadcrumbItems]="breadCrumbItems"
    [csvItems]="inscripcionesFiltradas"
    [csvColumns]="CSV_COLUMNS"
    [SelectedItems]="selectedItems"
    [newShow]="canCreateStudent"
    [exportShow]="canActivate.includes('VER')"
    (createEmitter)="openModal()">
  </app-data-header>

  <div class="card rounded-2">
    <div class="card-header border border-dashed border-end-0 border-start-0">
      <div class="row g-2">
        <div class="col-12 col-md-5">
          <div class="search-box">
            <input type="text" class="form-control search" placeholder="Buscar nombre, matrícula, documento, escuela o tutor..."
              [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
            <i class="ri-search-line search-icon"></i>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" [(ngModel)]="estado" (ngModelChange)="applyFilters()">
            <option value="">Todas las inscripciones</option>
            <option value="ACTIVA">Activas</option>
            <option value="INACTIVA">Inactivas</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <select class="form-select" [(ngModel)]="escuelaUuid" (ngModelChange)="applyFilters()">
            <option value="">Todas las escuelas</option>
            <option *ngFor="let escuela of escuelas" [value]="escuela.uuid">{{ escuela.nombre }}</option>
          </select>
        </div>
        <div class="col-6 col-md-1">
          <button type="button" class="btn btn-outline-secondary w-100" title="Limpiar filtros" (click)="clearFilters()">
            <i class="ri-refresh-line"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="text-muted small">
        <i class="ri-information-line me-1"></i>
        Cada fila resume un estudiante; las escuelas y tutores se administran en sus relaciones.
      </div>
      <button class="btn btn-soft-secondary btn-sm ms-2" (click)="toggleViewMode()">
        <i [class]="viewMode === 'table' ? 'ri-grid-fill me-1' : 'ri-list-check me-1'"></i>
        {{ viewMode === 'cards' ? 'Lista' : 'Grid' }}
      </button>
    </div>

    <div class="card-body">
      <app-data-table
        [loading]="loading"
        [itemsList]="itemsList"
        [allcontent]="inscripcionesFiltradas"
        [actions]="{
          show: canActivate.includes('VER'),
          edit: canActivate.includes('EDITAR'),
          close: canActivate.includes('DAR DE BAJA') ? 'Dar de baja' : '',
          check: canActivate.includes('HABILITAR') ? 'Habilitar' : '',
          process: canActivate.includes('EDITAR') ? 'Desvincular tutor' : ''
        }"
        (showItemEmitter)="openModal($event, 'show')"
        (editItemEmitter)="openModal($event, 'edit')"
        (closeItemEmitter)="darDeBaja($event)"
        (checkItemEmitter)="habilitar($event)"
        (processItemEmitter)="desvincularTutor($event)"
        [multiCheck]="canActivate.includes('VER')"
        (selectedItemEmitter)="getSelectedItems($event)"
        [viewMode]="viewMode"
        emptyMessage="No hay estudiantes para mostrar"
        emptyDescription="Cambie los filtros o registre una nueva relación estudiante-escuela.">
      </app-data-table>
    </div>
  </div>
</div>
