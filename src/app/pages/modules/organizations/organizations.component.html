<app-breadcrumbs [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="content">
    <app-data-header
        [breadcrumbItems]="breadCrumbItems"
        [csvItems]="organizacionesList"
        [csvColumns]="CSV_COLUMNS"
        [SelectedItems]="selectedItems"
        [newShow]="canActivate.includes('CREAR')"
        [exportShow]="canActivate.includes('VER')"
        (createEmitter)="openModal( undefined,'','lg')"
    ></app-data-header>
    <div class="card rounded-2">
      <div class="card-header border border-dashed border-end-0 border-start-0">
        <div class="row g-2">

          <div class="col-6 col-sm-6 col-lg-4">
            <div class="search-box">
              <input
                type="text"
                class="form-control search"
                name="searchTerm"
                [placeholder]="'Buscar...' | translate"
                [(ngModel)]="searchTerm"
                (ngModelChange)="applyFilters()">

              <i class="ri-search-line search-icon"></i>
            </div>
          </div>

          <div class="col-6 col-sm-6 col-lg-2">
            <select
              class="form-select"
              name="estado"
              [(ngModel)]="estado"
              (ngModelChange)="applyFilters()">

              <option [ngValue]="''">
                {{ 'Todos los estados' | translate }}
              </option>

              <option value="ACTIVO">
                {{ 'Activo' | translate }}
              </option>

              <option value="INACTIVO">
                {{ 'Inactivo' | translate }}
              </option>
            </select>
          </div>

          <div class="col-6 col-sm-6 col-lg-2">
            <select
              class="form-select"
              name="tieneNit"
              [(ngModel)]="tieneNit"
              (ngModelChange)="applyFilters()">

              <option [ngValue]="''">
                {{ 'Todos: NIT' | translate }}
              </option>

              <option value="SI">
                {{ 'Con NIT' | translate }}
              </option>

              <option value="NO">
                {{ 'Sin NIT' | translate }}
              </option>
            </select>
          </div>

          <div class="col-6 col-sm-6 col-lg-3">
            <select
              class="form-select"
              name="tienePersoneriaJuridica"
              [(ngModel)]="tienePersoneriaJuridica"
              (ngModelChange)="applyFilters()">

              <option [ngValue]="''">
                {{ 'Toda personería jurídica' | translate }}
              </option>

              <option value="SI">
                {{ 'Con Personería Jurídica' | translate }}
              </option>

              <option value="NO">
                {{ 'Sin Personería Jurídica' | translate }}
              </option>
            </select>
          </div>

          <div class="col-6 col-sm-6 col-lg-1">
            <button
              type="button"
              class="btn btn-outline-secondary w-100"
              [title]="'Limpiar' | translate"
              (click)="clearFilters()">

              <i class="ri-refresh-line align-bottom"></i>
            </button>
          </div>

        </div>
      </div>
      <div class="card-header p-0">
        <div class="row g-2">
          <div class="col-auto flex-grow-1">
            <ul
              ngbNav
              #nav="ngbNav"
              [activeId]="tipoOrganizacion"
              (navChange)="onNavChange($event)"
              class="nav nav-tabs nav-tabs-custom nav-success"
              role="tablist">

              <li
                [ngbNavItem]="'TODAS'"
                class="nav-item flex-shrink-0">

                <a ngbNavLink class="nav-link py-2">
                  {{ 'Todas' | translate }}

                  <span
                    *ngIf="tipoOrganizacion === 'TODAS'"
                    class="badge bg-secondary ms-1">
                    {{ getTabCount('TODAS') }}
                  </span>
                </a>
              </li>

              <li
                *ngFor="let tipo of tipoOrganizacionList"
                [ngbNavItem]="tipo"
                class="nav-item flex-shrink-0">

                <a ngbNavLink class="nav-link py-2">
                  {{ tipo.split('_').join(' ') | titlecase }}

                  <span
                    *ngIf="tipoOrganizacion === tipo"
                    class="badge bg-secondary ms-1">
                    {{ getTabCount(tipo) }}
                  </span>
                </a>
              </li>
            </ul>
          </div>
          <div class="col-auto ms-auto d-flex justify-content-end align-items-center gap-2">
            <button class="btn btn-soft-secondary btn-sm d-flex align-items-center"
                    (click)="toggleViewMode()">
                <i *ngIf="viewMode === 'table'" class="ri-grid-fill me-1"></i>
                <i *ngIf="viewMode === 'cards'" class="ri-list-check me-1"></i>
                <span>{{ (viewMode === 'cards' ? 'Lista' : 'Grid') | translate }}</span>
            </button>
            <div class="hstack ms-auto">
              <span class="dropdown d-md-inline-block" ngbDropdown>
                <button type="button" class="btn btn-soft-info btn-sm arrow-none"
                   id="dropdownMenuButton1" data-bs-toggle="dropdown" ngbDropdownToggle>
                  <i class="ri-settings-4-line"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton1" ngbDropdownMenu>
                  @for (column of itemsList; track column.prop) {
                    <li class="dropdown-item p-1">
                      <div class="form-check form-check-outline form-check-primary">
                        <input class="form-check-input" type="checkbox" [id]="'formCheck' + column.prop"
                            [(ngModel)]="column.visible">
                        <label class="form-check-label" [for]="'formCheck' + column.prop">
                            {{ column.name | translate }}
                        </label>
                      </div>
                    </li>
                  }
                </ul>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <app-data-table
          [loading]="loading"
          [itemsList]="itemsList"
          [allcontent]="organizacionesList"
          [actions]="{
            show: canActivate.includes('VER'),
            edit: canActivate.includes('ACTUALIZAR'),
            close: canActivate.includes('ANULAR')?'Eliminar':'',}"
          (showItemEmitter)="openModal($event,'show','md')"
          (editItemEmitter)="openModal($event,'edit','lg')"
          (closeItemEmitter)="openModal($event,'delete','md')"
          [multiCheck]="canActivate.includes('VER')"
          (selectedItemEmitter)="getSelectedItems($event)"
          [viewMode]="viewMode">
        </app-data-table>
      </div>
    </div>
</div>
