
<div class="row mb-3 pb-1">
    <div class="col-12">
        <div class="d-flex align-items-lg-center flex-lg-row flex-column">
            <div class="flex-grow-1">
                <h4 class="fs-16 mb-1">Bienvenida, {{userData.username}}!</h4>
                <p class="text-muted mb-0">Revisa tus reservas en Deportes GAMQ.</p>
            </div>
            <div class="mt-3 mt-lg-0">
                <div class="row g-3 mb-0 align-items-center">
                    <div class="col-auto">
                        <a routerLink="/reservations">
                            <button type="button" class="btn btn-soft-secondary">
                                <i class="ri-add-circle-line align-middle me-1"></i> 
                                Reservas
                            </button>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-xl-8">
        <div class="card">
            <div class="card-header border-0 align-items-center d-flex">
                <h4 class="card-title mb-0 flex-grow-1">Ingresos</h4>
                <div class="d-flex gap-1">
                  <button type="button" class="btn btn-soft-secondary btn-sm" (click)="setRevenueValue('all')">Todo</button>
                  <button type="button" class="btn btn-soft-secondary btn-sm" (click)="setRevenueValue('1M')">1M</button>
                  <button type="button" class="btn btn-soft-secondary btn-sm" (click)="setRevenueValue('6M')">6M</button>
                  <button type="button" class="btn btn-soft-primary btn-sm" (click)="setRevenueValue('1Y')">1A</button>
                </div>
            </div>
            <div class="card-header p-0 border-0 bg-light-subtle">
                <div class="row g-0 text-center">
                    <div class="col-6 col-sm-3">
                        <div class="p-3 border border-dashed border-start-0">
                            <h5 class="mb-1"><span [countUp]="totalReservations" class="counter-value" [options]="option"></span></h5>
                            <p class="text-muted mb-0">Reservas</p>
                        </div>
                    </div>
                    <div class="col-6 col-sm-3">
                        <div class="p-3 border border-dashed border-start-0">
                            <h5 class="mb-1"><span [countUp]="totalCancellations" class="counter-value" [options]="option"></span></h5>
                            <p class="text-muted mb-0">Cancelaciones</p>
                        </div>
                    </div>
                    <div class="col-6 col-sm-3">
                        <div class="p-3 border border-dashed border-start-0">
                            <h5 class="mb-1">Bs. <span [countUp]="totalIncome" class="counter-value" [options]="option"></span></h5>
                            <p class="text-muted mb-0">Ingresos</p>
                        </div>
                    </div>
                    <div class="col-6 col-sm-3">
                        <div class="p-3 border border-dashed border-start-0 border-end-0">
                            <h5 class="mb-1 text-success"><span [countUp]="conversionRatio" class="counter-value" [options]="option"></span>%</h5>
                            <p class="text-muted mb-0">Reservas Exitosas</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-body p-0 pb-2">
                <div class="w-100">
                    <apx-chart *ngIf="reservationsList.length>0" 
                        dir="ltr" class="apex-charts" 
                        [series]="analyticsChart.series"
                        [chart]="analyticsChart.chart"
                        [xaxis]="analyticsChart.xaxis"
                        [stroke]="analyticsChart.stroke"
                        [dataLabels]="analyticsChart.dataLabels"
                        [yaxis]="analyticsChart.yaxis"
                        [labels]="analyticsChart.labels"
                        [legend]="analyticsChart.legend"
                        [title]="analyticsChart.title"
                        
                        [colors]="analyticsChart.colors" 
                        [fill]="analyticsChart.fill"  
                        [plotOptions]="analyticsChart.plotOptions" 
                        [tooltip]="analyticsChart.tooltip" 
                        [grid]="analyticsChart.grid" 
                        [annotations]="analyticsChart.annotations" 
                        [markers]="analyticsChart.markers"
                    >
                    </apx-chart>                    
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-4 col-md-6">
        <div class="card card-height-100">
            <div class="card-header align-items-center d-flex">
                <h4 class="card-title mb-0 flex-grow-1">Ingresos por Complejo</h4>
                <div class="flex-shrink-0">
                    <div class="dropdown card-header-dropdown" ngbDropdown>
                        <a class="text-body dropdown-btn arrow-none" href="javascript:void(0);"
                            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" ngbDropdownToggle>
                            <span class="text-muted fs-16"><i class="mdi mdi-dots-vertical align-middle"></i></span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
                            <a class="dropdown-item" (click)="onDateRangeChange('Today')">Hoy</a>
                            <a class="dropdown-item" (click)="onDateRangeChange('Weekly')">Esta Semana</a>
                            <a class="dropdown-item" (click)="onDateRangeChange('Monthly')">Este Mes</a>
                            <a class="dropdown-item" (click)="onDateRangeChange('Year')">Este Año</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive table-card">
                    <app-top-pages [List]="filteredReservations"></app-top-pages>
                </div>
            </div>
        </div>
    </div>
</div>
