<div class="modal-header bg-light">
    <div class="d-flex align-items-center">
        <i class="bi bi-geo-alt-fill text-primary me-2 fs-4"></i>
        <h5 class="modal-title mb-0" ngbAutofocus>{{ title }}</h5>
    </div>
    <button 
        title="Cerrar"
        type="button"
        class="btn-close shadow-none"
        (click)="cerrarMapa()">
    </button>
</div>

<div class="modal-body p-0 position-relative">
    <div id="map" class="w-100" style="height: 450px; position: relative;">
        <div class="map-controls-overlay" *ngIf="form">
            <div class="d-flex flex-column gap-2">
                <button 
                    class="btn btn-light btn-sm shadow-sm d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;"
                    (click)="useCurrentLocation()"
                    [disabled]="isLoadingLocation"
                    title="Usar mi ubicación actual">
                    <i class="bi" [ngClass]="isLoadingLocation ? 'bi-arrow-repeat spinner' : 'bi-crosshair'"></i>
                </button>
                <button 
                    class="btn btn-light btn-sm shadow-sm d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;"
                    (click)="centerOnMarker()"
                    title="Centrar en marcador">
                    <i class="bi bi-bullseye"></i>
                </button>
                <button 
                    class="btn btn-light btn-sm shadow-sm d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;"
                    (click)="resetMapa()"
                    title="Restablecer mapa">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>
    </div>
x`
    <div class="location-info-panel border-top">
        <div class="p-2">
            <div class="alert alert-warning alert-dismissible fade show mb-3" role="alert" *ngIf="errorMessage">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ errorMessage }}
                <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
            </div>
            <div class="alert alert-info mb-2" *ngIf="isLoadingLocation">
                <div class="d-flex align-items-center">
                    <div class="spinner-border spinner-border-sm me-2" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <span>Obteniendo ubicación actual...</span>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small mb-1">
                    <i class="bi bi-pin-map-fill me-1"></i>
                    DIRECCIÓN
                </label>
                <div class="d-flex align-items-start gap-2">
                    <div class="flex-grow-1">
                        <p class="mb-0 text-dark" style="line-height: 1.5;">
                            {{ direccion || 'Selecciona una ubicación en el mapa' }}
                        </p>
                    </div>
                    <button 
                        class="btn btn-sm btn-secondary"
                        (click)="copiarCoordenadas()"
                        *ngIf="direccion"
                        title="Copiar coordenadas">
                        <i class="bi bi-clipboard"></i>Copiar coordenadas
                    </button>
                </div>
            </div>
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label fw-semibold text-secondary small mb-1">
                        <i class="bi bi-geo me-1"></i>
                        LATITUD
                    </label>
                    <input 
                        type="text" 
                        class="form-control form-control-sm" 
                        [value]="latitud.toFixed(8)" 
                        readonly>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold text-secondary small mb-1">
                        <i class="bi bi-geo me-1"></i>
                        LONGITUD
                    </label>
                    <input 
                        type="text" 
                        class="form-control form-control-sm" 
                        [value]="longitud.toFixed(8)" 
                        readonly>
                </div>
            </div> 
            <div class="mt-3 p-2 bg-light rounded" *ngIf="form">
                <small class="text-muted d-block">
                    <i class="bi bi-info-circle me-1"></i>
                    <strong>Tip:</strong> Puedes hacer clic en el mapa o arrastrar el marcador para seleccionar una ubicación exacta.
                </small>
            </div>
        </div>
    </div>
</div>

<div class="modal-footer bg-light" *ngIf="form">
    <button
        type="button"
        class="btn btn-primary rounded-3 px-2"
        (click)="guardarUbicacion()"
        [disabled]="!direccion || direccion.trim() === ''">
        <i class="bi bi-check-circle me-2"></i>
        Guardar Ubicación
    </button>
    <button
        type="button"
        class="btn btn-outline-secondary rounded-3 px-4"
        (click)="cerrarMapa()">
        <i class="bi bi-x-circle me-2"></i>
        Cancelar
    </button>
</div>

<!-- View-only mode footer -->
<div class="modal-footer bg-light" *ngIf="!form">
    <button
        type="button"
        class="btn btn-secondary rounded-3 px-4"
        (click)="cerrarMapa()">
        <i class="bi bi-x-circle me-2"></i>
        Cerrar
    </button>
</div>
