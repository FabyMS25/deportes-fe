<div class="modal-header">
    <h5 class="modal-title" ngbAutofocus>Mapa</h5>
    <button title="close"
        type="button"
        class="btn-close shadow-none"
        (click)="cerrarMapa()">
    </button>
</div>
<div class="modal-body p-0">
    <div id="map" class="container" style="height: 400px;"></div>

  <div  class="mt-2 px-3 pb-0">
        <p>
          Dirección: {{ direccion }}
        </p>
        <p>
          Latitud: {{latitud}},
          / Longitud: {{longitud}}
        </p>
  </div>
</div>
<div class="modal-footer" *ngIf="form">
    <button
        type="button"
        class="btn btn-outline-primary rounded-3"
        (click)="guardarUbicacion()">
        Guardar
    </button>
    <button
        type="button"
        class="btn btn-outline-secondary mr-3 rounded-3"
        (click)="cerrarMapa()">
        Cancelar
    </button>
</div>
