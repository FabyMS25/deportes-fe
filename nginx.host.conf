worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json webmanifest;
    }

    server {
        listen 80;
        listen 181.177.143.187:80;
        listen 192.168.7.21:80;  
        server_name 181.177.143.187 192.168.7.21;

        # Frontend (Docker)
        location /gamq-deportes/ {
            proxy_pass http://127.0.0.1:4205/gamq-deportes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend API — fix CORS by overriding Origin
        location /api/ {
            proxy_pass http://181.177.143.187:8085/api/;
            proxy_set_header Host 181.177.143.187:8085;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin http://181.177.143.187:8085;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin *;
        }

        # Auth API — goes to .185:8080, fix CORS too
        location /auth-api/ {
            proxy_pass http://181.177.143.185:8080/api/;
            proxy_set_header Host 181.177.143.185:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Origin http://181.177.143.185:8080;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin *;
        }

        # WebSocket notifications
        location /ws-notificaciones/ {
            proxy_pass http://181.177.143.187:8085/ws-notificaciones/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = / {
            return 301 /gamq-deportes/;
        }
    }
}