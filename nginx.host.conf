worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name 181.177.143.187;

        # Frontend container (now runs on port 4205)
        location /gamq-deportes/ {
            proxy_pass http://127.0.0.1:4205/gamq-deportes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Also proxy /api and /auth-api so the container's nginx can handle them
        location /api/ {
            proxy_pass http://127.0.0.1:4205/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /auth-api/ {
            proxy_pass http://127.0.0.1:4205/auth-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Redirect root to app
        location = / {
            return 301 /gamq-deportes/;
        }
    }
}